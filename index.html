<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anna Kalmykova — Game Designer</title>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;800&family=Onest:wght@400;500;700&display=swap" rel="stylesheet">
<style>

/* ===== 1. ОБЩИЕ НАСТРОЙКИ: цвета (--red, --bg ...), шрифты, ширина страницы ===== */
:root {
  --bg:#efe4cf;
  --paper:#f7f0e1;
  --red:#a8201a;
  --deep:#7a1511;
  --ink:#2b1a16;
  --sand:#d9c7a6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}

*,*:before,*:after {
  box-sizing:inherit;
}

html {
  scroll-padding-top:70px;
  scroll-behavior:smooth;
}

body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:400 17px/1.6 Onest,system-ui,sans-serif;
}

h1,h2,h3 {
  font-family:Bitter,Georgia,serif;
  line-height:1.15;
  margin:0;
}

a {
  color:inherit;
}

:focus-visible {
  outline:3px solid var(--red);
  outline-offset:2px;
}

.wrap {
  max-width:1040px;
  margin:0 auto;
  padding:0 22px;
}


/* ===== 2. ШАПКА: имя слева, меню и переключатель EN/RU ===== */
header.top {
  position:sticky;
  top:0;
  z-index:9;
  background:var(--red);
  color:var(--paper);
}

header.top .wrap {
  display:flex;
  align-items:center;
  gap:18px;
  height:56px;
}

.logo {
  font-family:Bitter,serif;
  font-weight:800;
  text-decoration:none;
  margin-right:auto;
  line-height:1.15;
  font-size:15px;
}

.logo small {
  display:block;
  font:400 12px Onest;
  color:var(--sand);
}

nav {
  display:flex;
  gap:18px;
  font-size:15px;
}

nav a {
  text-decoration:none;
}

nav a:hover {
  text-decoration:underline;
}

.lang {
  display:flex;
  border:2px solid var(--paper);
}

.lang button {
  background:none;
  border:0;
  color:var(--paper);
  font:700 13px Onest;
  padding:3px 9px;
  cursor:pointer;
}

.lang button.on {
  background:var(--paper);
  color:var(--red);
}

@media(max-width:700px) {
  nav {
    display:none;
  }
}


/* ===== 3. ОБО МНЕ (красный первый экран): цифры, текст, фото ===== */
.hero {
  background:var(--red);
  color:var(--paper);
  padding:56px 0 70px;
  position:relative;
}

.hero:after {
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:-14px;
  height:14px;
  background:repeating-linear-gradient(90deg,var(--deep) 0 28px,var(--red) 28px 56px);
  background-size:56px 14px;           /* ширина одного «зубца» (период полоски) */
  animation:stripeRun 2.24s linear infinite; /* 56px / 2.24с = 25px/с — как у надписи */
}
@keyframes stripeRun{from{background-position:0 0}to{background-position:-56px 0}}

.hero .wrap {
  display:grid;
  grid-template-columns:130px minmax(0,1.5fr) minmax(0,1fr);
  gap:36px;
  align-items:center;
}

.stats {
  overflow:hidden;
  border-right:3px solid var(--paper);
  padding-right:24px;
  text-align:right;
  display:grid;
  gap:26px;
  align-self:stretch;
  align-content:center;
}

.stats b {
  display:block;
  font:800 40px/1 Bitter,serif;
}

.stats span {
  font-size:14px;
  color:var(--sand);
}

.stats.anim>div {
  animation:statIn .7s cubic-bezier(.2,.8,.2,1) both;
  --from:140%;
}

.stats.anim>div:nth-child(2) {
  animation-delay:.15s;
}

.stats.anim>div:nth-child(3) {
  animation-delay:.3s;
}

@keyframes statIn {
  from {
    transform:translateX(var(--from));
  }
  to {
    transform:none;
  }
}

.hero .kick {
  font-size:18px;
  color:var(--sand);
}
/* БЕГУЩАЯ СТРОКА «как вывеска»: окно --win показывает примерно два слова.
   Скорость = 25px/с (JS подгоняет время под длину текста), у полоски те же 25px/с.
   Хочешь медленнее — увеличь оба времени (11.2s и 2.24s) в одинаковое число раз. */
.mq{--win:12em;width:var(--win);max-width:100%;overflow:hidden;white-space:nowrap;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.mq-t{--w:280px;display:inline-block;animation:mqRun 11.2s linear infinite} /* --w и время выставляет JS (функция fitMarquee) */
.mq-t span{display:inline-block;padding-right:.45em} /* .45em = расстояние между повторами; меняй тут */
@keyframes mqRun{from{transform:translateX(0)}to{transform:translateX(calc(-1*var(--w)))}}

.hero .by {
  font-size:20px;
  margin:6px 0 10px;
}

.hl {
  display:inline-flex;
  gap:6px;
  margin-left:8px;
}

.hl button {
  background:var(--paper);
  color:var(--red);
  border:2px solid var(--ink);
  font:700 13px Onest;
  padding:1px 10px;
  cursor:pointer;
}

.hl button.on {
  background:var(--ink);
  color:var(--paper);
}

.side .btns {
  margin-top:22px;
  flex-direction:column;
  align-items:flex-start;
}

.hero h1 {
  font-size:clamp(40px,7vw,76px);
  font-weight:800;
}

.hero .role {
  font-size:19px;
  margin:10px 0 18px;
  color:var(--sand);
}

.hero p {
  max-width:52ch;
  margin:0 0 12px;
}

.photo {
  aspect-ratio:4/5;
  background:var(--sand);
  border:3px solid var(--ink);
  box-shadow:10px 10px 0 var(--deep);
  display:grid;
  place-items:center;
  color:var(--ink);
  font-size:14px;
  text-align:center;
  padding:10px;
  overflow:hidden;
}

/* Фото заполняет рамку целиком и обрезается по её размеру (рамка не меняется от размера фото) */
.photo {
  position:relative;
}
.photo img {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

@media(max-width:860px) {
  .hero .wrap {
    grid-template-columns:1fr;
  }
  .photo {
    max-width:280px;
  }
  .stats {
    border-right:0;
    border-left:3px solid var(--paper);
    padding:0 0 0 16px;
    text-align:left;
    grid-auto-flow:column;
    gap:22px;
    order:2;
  }
  .stats.anim>div {
    animation-delay:0s!important;
  }
  .stats.anim>div:nth-child(1) {
    --from:-140%;
  }
  .stats.anim>div:nth-child(2) {
    --from:-260%;
  }
  .stats.anim>div:nth-child(3) {
    --from:-380%;
  }
}


/* ===== 4. КНОПКИ ===== */
.btns {
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:22px;
}

.btn {
  display:inline-block;
  background:var(--paper);
  color:var(--red);
  border:2px solid var(--ink);
  padding:8px 18px;
  font-weight:700;
  text-decoration:none;
  box-shadow:4px 4px 0 var(--ink);
  transition:transform .12s,box-shadow .12s;
}

.btn:hover {
  transform:translate(2px,2px);
  box-shadow:2px 2px 0 var(--ink);
}

.btn.red {
  background:var(--red);
  color:var(--paper);
}


/* ===== 5. ЗАГОЛОВКИ СЕКЦИЙ ===== */
section.s {
  padding:74px 0 10px;
}

.s h2 {
  font-size:clamp(30px,5vw,46px);
  margin-bottom:38px;
  color:var(--deep);
  text-align:center;
}

.s h2:after {
  content:"";
  display:block;
  width:70px;
  height:3px;
  background:var(--ink);
  margin:12px auto 0;
}


/* ===== 6. ОПЫТ: таймлайн ===== */
.tl {
  position:relative;
  display:grid;
  gap:26px;
}

.tl:before {
  content:"";
  position:absolute;
  left:11px;
  top:27px;
  bottom:6px;
  width:4px;
  background:var(--red);
}

.ev {
  position:relative;
  padding-left:44px;
}

.ev:before {
  content:"";
  position:absolute;
  left:1px;
  top:7px;
  width:20px;
  height:20px;
  box-sizing:border-box;
  background:var(--bg);
  border:4px solid var(--red);
  border-radius:50%;
}

.ev h3 {
  font-size:22px;
}

.ev .meta {
  color:var(--deep);
  font-weight:500;
  margin:2px 0 6px;
}

.ev ul {
  margin:6px 0 0;
  padding-left:20px;
}

.ev p {
  margin:6px 0;
  max-width:60ch;
}

.ev .btn {
  display:inline-block;
  margin-top:14px;
  padding:5px 14px;
  font-size:15px;
}

.ev ul {
  clear:both;
}

@media(min-width:860px) {
  .tl:before {
    left:50%;
    margin-left:-2px;
  }
  .ev {
    width:50%;
    padding:0 40px 0 0;
    text-align:left;
  }
  .ev:before {
    left:auto;
    right:-10px;
  }
  .ev:nth-child(even) {
    margin-left:50%;
    padding:0 0 0 40px;
    text-align:left;
  }
  .ev:nth-child(even):before {
    right:auto;
    left:-10px;
  }
  .ev p, .ev ul {
    margin-left:0;
    margin-right:0;
  }
  .ev ul {
    display:block;
  }
}


/* ===== 7. ПОРТФОЛИО: плитки-фигуры (формы задаются в JS, массив SHAPES) ===== */
.grid {
  position:relative;
  aspect-ratio:1267/567;
  margin:0 6px;
}

.tile {
  position:absolute;
  left:var(--l);
  top:var(--t);
  width:var(--w);
  display:block;
  text-decoration:none;
  color:var(--paper);
  pointer-events:none;
  transition:transform .15s;
}

.tile svg {
  display:block;
  width:100%;
  height:auto;
  overflow:visible;
  pointer-events:none;
}

.tile polygon {
  pointer-events:auto;
}

a.tile:hover {
  transform:translateY(-4px);
}

.tile .cap {
  position:absolute;
  left:var(--cx);
  top:var(--cy);
  transform:translate(-50%,-50%);
  width:max-content;
  max-width:60%;
  text-align:center;
  pointer-events:none;
}

.tile .cap b {
  display:block;
  font:800 clamp(18px,2.6vw,30px)/1.15 Bitter,serif;
}

.tile .cap small {
  display:block;
  opacity:.85;
}

.tile .cap.hov {
  opacity:0;
  background:rgba(43,26,22,.78);
  padding:6px 14px;
  transition:opacity .2s;
}

a.tile:hover .cap.hov,a.tile:focus-visible .cap.hov {
  opacity:1;
}

.tile.soon {
  color:var(--deep);
}

@media(max-width:760px) {
  .grid {
    aspect-ratio:auto;
    display:grid;
    gap:16px;
  }
  .tile {
    position:relative;
    left:auto;
    top:auto;
    width:100%;
  }
  .tile .cap {
    max-width:80%;
  }
}


/* ===== 8. НАВЫКИ: карточки и всплывающие подсказки ===== */
.sk {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:16px;
}

.sk div {
  background:var(--paper);
  border:3px solid var(--ink);
  padding:18px 20px;
}

.sk h3 {
  font-size:20px;
  margin-bottom:10px;
  color:var(--red);
}

.sk ul {
  margin:0;
  padding-left:0;
  list-style:none;
}

.sk li {
  position:relative;
  padding:6px 0;
  border-bottom:2px dashed rgba(43,26,22,.4); /* пунктир между навыками: намёк, что можно навести */
}
.sk li:last-child{border-bottom:0}
.sk li[tabindex]:hover{color:var(--red)}

.sk .tip {
  display:none;
  position:absolute;
  left:0;
  top:100%;
  z-index:6;
  width:240px;
  margin-top:4px;
  padding:10px 12px;
  background:var(--paper);
  border:3px solid var(--ink);
  box-shadow:4px 4px 0 var(--red);
  font-size:14px;
  line-height:1.4;
}

.sk .tip b {
  display:block;
  font-family:Bitter,serif;
  color:var(--red);
  margin-bottom:2px;
}

.sk li:hover .tip,.sk li:focus .tip,.sk li:focus-within .tip {
  display:block;
}

.sk>div:last-child .tip {
  left:auto;
  right:0;
}

.cert {
  display:block;
  color:var(--red);
  font-weight:700;
  text-decoration:none;
  margin-top:2px;
}

.cert:hover {
  text-decoration:underline;
}


/* ===== 9. ОБРАЗОВАНИЕ: карточка со слайдером ===== */
.edcar {
  max-width:720px;
  margin:0 auto;
}

.edu {
  position:relative;
  display:none;
  grid-template-columns:1fr 150px;
  gap:22px;
  align-items:center;
  background:var(--paper);
  border:3px solid var(--ink);
  box-shadow:6px 6px 0 var(--red);
  padding:30px 28px 26px;
  min-height:230px;
}

.edu.on {
  display:grid;
}

.edu .y {
  color:var(--deep);
  font-size:15px;
}

.edu h3 {
  font-size:30px;
  margin:6px 0;
}

.edu .sq {
  aspect-ratio:1;
  border:3px solid var(--ink);
  border-radius:22px;
  background:var(--bg);
  display:grid;
  place-items:center;
  text-align:center;
  font-size:13px;
  padding:8px;
}

.edu .gpa {
  position:absolute;
  top:10px;
  right:14px;
  background:var(--red);
  color:var(--paper);
  font-weight:700;
  padding:1px 12px;
  border:2px solid var(--ink);
}

.edu.soon {
  grid-template-columns:1fr;
  justify-items:center;
  border-style:dashed;
  box-shadow:none;
}

.edu.soon .sq {
  width:150px;
  font:800 20px Bitter,serif;
  color:var(--deep);
}

.edu a.sq {
  color:var(--ink);
  text-decoration:none;
  font:700 17px/1.25 Onest,sans-serif;
  cursor:pointer;
  transition:background .15s;
}

.edu a.sq:hover {
  background:var(--sand);
}

.edu a.sq:active {
  background:var(--deep);
  color:var(--paper);
}

.ednav {
  display:flex;
  justify-content:center;
  align-items:center;
  gap:14px;
  margin-top:22px;
}

.ednav button {
  width:40px;
  height:40px;
  border:2px solid var(--ink);
  background:var(--paper);
  color:var(--red);
  font:800 20px Onest;
  cursor:pointer;
}

.ednav i {
  width:10px;
  height:10px;
  border:2px solid var(--ink);
  background:var(--bg);
}

.ednav i.on {
  background:var(--red);
}

@media(max-width:560px) {
  .edu {
    grid-template-columns:1fr;
    padding-top:44px;
  }
  .edu .sq {
    width:110px;
  }
}


/* ===== 10. КОНТАКТЫ ===== */
.crow {
  display:grid;
  grid-template-columns:64px 160px 1fr auto;
  gap:18px;
  align-items:center;
  padding:20px 0;
  border-top:3px solid var(--ink);
  text-decoration:none;
}

.crow:last-of-type {
  border-bottom:3px solid var(--ink);
}

.crow b {
  font:800 22px Bitter,serif;
}

.crow:hover {
  background:var(--paper);
}

.crow span:last-child {
  color:var(--red);
  font-weight:700;
  font-size:22px;
}

.ic {
  width:56px;
  height:56px;
  border-radius:50%;
  background:var(--red);
  color:var(--paper);
  display:grid;
  place-items:center;
  font:800 20px Bitter,serif;
}

.ic svg {
  width:26px;
  height:26px;
}

@media(max-width:600px) {
  .crow {
    grid-template-columns:56px 1fr auto;
  }
  .crow span:nth-of-type(2) {
    grid-column:2;
  }
  .crow b {
    grid-column:2;
  }
}

.more {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:16px;
  margin-top:20px;
}

.more a {
  display:grid;
  grid-template-columns:26px 1fr;
  gap:2px 10px;
  align-items:center;
  border:3px solid var(--ink);
  background:var(--paper);
  padding:18px 20px;
  text-decoration:none;
  box-shadow:5px 5px 0 var(--ink);
}

.more a:hover {
  background:var(--sand);
}

.more a svg {
  width:24px;
  height:24px;
  color:var(--red);
}

.more b {
  font-family:Bitter,serif;
  font-size:20px;
}

.more small {
  grid-column:2;
}


/* ===== 11. СТРАНИЦА ИГРЫ ===== */
.back {
  display:inline-block;
  margin:28px 0 0;
  font-weight:700;
  color:var(--red);
}

.gh {
  display:grid;
  grid-template-columns:1.3fr 1fr;
  gap:30px;
  margin-top:14px;
}

.gh h1 {
  font-size:clamp(34px,6vw,58px);
  color:var(--red);
}

.gh .sub {
  font:500 22px Bitter,serif;
  color:var(--deep);
  margin:6px 0 16px;
}

dl {
  display:grid;
  grid-template-columns:110px 1fr;
  gap:8px 18px;
  margin:0;
}

dt {
  color:var(--red);
  font-weight:700;
}

dd {
  margin:0;
}

@media(max-width:760px) {
  .gh {
    grid-template-columns:1fr;
  }
}

.car {
  position:relative;
  border:3px solid var(--ink);
  box-shadow:8px 8px 0 var(--ink);
  background:var(--ink);
}

.car .sl {
  aspect-ratio:16/10;
  display:none;
  place-items:center;
  color:var(--paper);
  font:800 24px Bitter,serif;
  text-align:center;
  padding:14px;
}

.car .sl.on {
  display:grid;
}

.car .sl {
  position:relative;
}
/* Картинка в листалке: рамка всегда одного размера (16:10), любая картинка вписывается целиком (contain),
   лишнее — тёмные поля. Хочешь, чтобы картинка заполняла рамку и обрезалась — поменяй contain на cover */
.car img {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
}

.car .nv {
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:42px;
  height:42px;
  border:2px solid var(--ink);
  background:var(--paper);
  color:var(--red);
  font:800 20px Onest;
  cursor:pointer;
}

.car .p {
  left:8px;
}

.car .n {
  right:8px;
}

.car .ct {
  position:absolute;
  right:10px;
  bottom:8px;
  background:var(--paper);
  padding:0 8px;
  font-size:14px;
  border:2px solid var(--ink);
}

.blk {
  margin-top:44px;
  max-width:68ch;
}

.blk h2 {
  font-size:28px;
  color:var(--deep);
  margin-bottom:10px;
}

.blk ul {
  padding-left:20px;
}

.ex {
  background:var(--paper);
  border-left:8px solid var(--red);
  padding:14px 20px;
}


/* ===== 12. ПОДВАЛ и отключение анимаций ===== */
footer {
  margin-top:90px;
  padding:24px 0;
  background:var(--ink);
  color:var(--sand);
  font-size:14px;
}

@media(prefers-reduced-motion:reduce) {
  * {
    animation:none!important;
    transition:none!important;
    scroll-behavior:auto!important;
  }
}

</style></head>
<body>
<!-- ===== ШАПКА (логотип, меню, EN/RU). Меню строится в JS: функция nav() ===== -->
<header class="top"><div class="wrap">
<a class="logo" href="#/" id="logo"></a>
<nav id="nav"></nav>
<div class="lang" role="group" aria-label="Language"><button data-l="en">EN</button><button data-l="ru">RU</button></div>
</div></header>
<!-- ===== ВЕСЬ КОНТЕНТ рисуется скриптом в этот блок ===== -->
<main id="app"></main>
<footer><div class="wrap">© 2026 Anna Kalmykova</div></footer>

  return `<${tag} class="tile${g?"":" soon"}"${g?` href="#/game/${g.id}"`:""} style="--l:${sh.x/12.67}%;--t:${sh.y/5.67}%;--w:${sh.w/12.67}%;--cx:${(sh.cap[0]-sh.x)/sh.w*100}%;--cy:${(sh.cap[1]-sh.y)/sh.h*100}%;aspect-ratio:${sh.w}/${sh.h}">
   <svg viewBox="0 0 ${sh.w} ${sh.h}" aria-hidden="true">
    <defs><clipPath id="cp${i}"><polygon points="${pts}"/></clipPath></defs>
    <polygon points="${pts}" fill="${g?g.c:"var(--sand)"}"/>
    ${cov?`<image href="${cov}" width="${sh.w}" height="${sh.h}" preserveAspectRatio="xMidYMid slice" clip-path="url(#cp${i})"/>`:""}
    <polygon points="${pts}" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linejoin="miter" stroke-miterlimit="10" vector-effect="non-scaling-stroke"/>
   </svg>
   <span class="cap${cov?" hov":""}"><b>${esc(g?g.n:L(UI.soon))}</b>${g?`<small>${g.y}</small>`:""}</span>
  </${tag}>`}).join("")}</div></section>`}

/* ---- Секция: НАВЫКИ (список с подсказками из SKILL_INFO) ---- */
function skillUl(i){return "<ul>"+L(UI.skillsL[i]).map((name,j)=>{const inf=SKILL_INFO[UI.skillsL[i][0][j]];
 return `<li${inf&&inf.d?' tabindex="0"':""}>${esc(name)}${inf&&inf.file?` <a class="cert" href="${inf.file}" target="_blank" rel="noopener">${esc(L(UI.cert))}</a>`:""}${inf&&inf.d?`<span class="tip"><b>${esc(name)}</b>${esc(L(inf.d))}</span>`:""}</li>`}).join("")+"</ul>"}
function skillsHTML(){
 return `<section class="s" id="skills"><h2>${esc(L(UI.h.skills))}</h2><div class="sk">${UI.skillsT.map((t,i)=>`<div><h3>${esc(L(t))}</h3>${skillUl(i)}</div>`).join("")}</div></section>`}

/* ---- Секция: ОБРАЗОВАНИЕ (слайдер; сейчас карточка + «скоро будет») ---- */
function eduHTML(){
 return `<section class="s"><h2>${esc(L(UI.h.edu))}</h2><div class="edcar" id="edcar"><div class="edu on"><span class="gpa">GPA ${esc(UI.edu.gpa)}</span><div><div class="y">${esc(L(UI.edu.y))}</div><div>${esc(L(UI.edu.d))}</div><h3>${esc(L(UI.edu.t))}</h3><div>${esc(L(UI.edu.s))}</div></div><a class="sq" href="${FILES.recordBook}" target="_blank" rel="noopener">${esc(L(UI.record))}</a></div><div class="edu soon"><div class="sq">${esc(L(UI.soon))}</div></div><div class="ednav"><button aria-label="Previous">‹</button><i></i><i></i><button aria-label="Next">›</button></div></div></section>`}

/* ---- Секция: КОНТАКТЫ (внизу главной; кнопка «Контакты» в меню скроллит сюда) ---- */
function contactsHTML(){
 return `<section class="s" id="contacts"><h2>${esc(L(UI.h.contacts))}</h2><p style="text-align:center;margin-top:-18px">${esc(L(UI.always))}</p>${rows()}${more()}</section>`}

/* ---- Главная страница = все секции подряд ---- */
function home(){
 return heroHTML()+`<div class="wrap">${expHTML()}${portHTML()}${skillsHTML()}${eduHTML()}${contactsHTML()}</div>`}

/* ---- Страница отдельной игры (одна функция для ВСЕХ игр, данные из GAMES) ---- */
let si=0;
function game(id){
 const g=GAMES.find(x=>x.id===id);if(!g)return home();
 const slides=g.imgs.length?g.imgs.map(u=>`<div class="sl"><img src="${u}" alt=""></div>`):[1,2,3].map(i=>`<div class="sl" style="background:${g.c}">${esc(g.n)} — ${i}</div>`);
 si=0;
 return `<div class="wrap"><a class="back" href="#/">${esc(L(UI.back))}</a>
 <div class="gh"><div><h1>${esc(g.n)} <span style="font-size:.4em;color:var(--deep)">${g.y}</span></h1><div class="sub">${esc(L(g.role))}</div>
 <dl><dt>${esc(L(UI.f.engine))}</dt><dd>${esc(L(g.eng))}</dd><dt>${esc(L(UI.f.theme))}</dt><dd>${esc(L(g.genre))}</dd><dt>${esc(L(UI.f.pitch))}</dt><dd>${esc(L(g.pitch))}</dd></dl>
 <div class="btns"><a class="btn red" href="${g.itch}">${esc(L(UI.itch))}</a></div></div>
 <div class="car" id="car">${slides.join("")}<button class="nv p" aria-label="Previous">‹</button><button class="nv n" aria-label="Next">›</button><span class="ct"></span></div></div>
 <div class="blk"><h2>${esc(L(UI.did))}</h2>${ul(L(g.did))}</div>
 <div class="blk"><h2>${esc(L(UI.solved))}</h2><div class="ex">${esc(L(g.solved))}</div></div></div>`}
function carousel(){const c=$("#car");if(!c)return;const s=[...c.querySelectorAll(".sl")];
 const show=i=>{si=(i+s.length)%s.length;s.forEach((e,k)=>e.classList.toggle("on",k===si));c.querySelector(".ct").textContent=(si+1)+" / "+s.length};
 c.querySelector(".p").onclick=()=>show(si-1);c.querySelector(".n").onclick=()=>show(si+1);show(0)}
function edcar(){const c=$("#edcar");if(!c)return;const sl=[...c.querySelectorAll(".edu")],dots=[...c.querySelectorAll("i")],bt=c.querySelectorAll(".ednav button");let k=0;const sh=i=>{k=(i+sl.length)%sl.length;sl.forEach((e,j)=>e.classList.toggle("on",j===k));dots.forEach((e,j)=>e.classList.toggle("on",j===k))};bt[0].onclick=()=>sh(k-1);bt[1].onclick=()=>sh(k+1);sh(0)}
/* =====================================================================
   9. ОТРИСОВКА И СОБЫТИЯ
   isLang = true, когда меняем язык: тогда прокрутка и анимация цифр не трогаются,
   поэтому вёрстка не прыгает
   ===================================================================== */
let VIEW="";
// подгоняет бегущую строку: шаг = ширина одного текста, время = ширина/25 (25px/с, как у полоски)
function fitMarquee(){document.querySelectorAll(".mq-t").forEach(t=>{const w=t.firstElementChild.getBoundingClientRect().width;if(w){t.style.setProperty("--w",w+"px");t.style.animationDuration=(w/25)+"s"}})}
function render(isLang){
 document.documentElement.lang=lang;nav();ANIM=!isLang;
 document.querySelectorAll("[data-l]").forEach(b=>b.classList.toggle("on",b.dataset.l===lang));
 const id=(location.hash||"#/").replace(/^#\/?/,""),isGame=id.startsWith("game/");
 $("#app").innerHTML=isGame?game(id.slice(5)):home();carousel();edcar();VIEW=isGame?"game":"home";fitMarquee();if(document.fonts)document.fonts.ready.then(fitMarquee);
 if(isLang)return;
 const t=!isGame&&id?document.getElementById(id):null;
 if(t)t.scrollIntoView();else window.scrollTo(0,0)}
document.addEventListener("click",e=>{const b=e.target.closest("[data-l]");if(!b)return;lang=b.dataset.l;try{localStorage.setItem("lang",lang)}catch(x){}render(true)});
// любая ссылка вида #/секция на главной: плавно едем к секции, даже если мы уже на этом адресе
document.addEventListener("click",e=>{const a=e.target.closest('a[href^="#/"]');if(!a||VIEW!=="home")return;
 const id=a.getAttribute("href").slice(2);if(id.startsWith("game/"))return;
 const t=id?document.getElementById(id):null;
 if(t||!id){e.preventDefault();history.replaceState(null,"",a.getAttribute("href"));t?t.scrollIntoView():scrollTo({top:0})}});
// клик по меню на главной: просто едем вниз к секции (Контакты тоже), без перерисовки
addEventListener("hashchange",()=>{const id=(location.hash||"#/").replace(/^#\/?/,""),t=id&&!id.startsWith("game/")?document.getElementById(id):null;
 if(VIEW==="home"&&t){t.scrollIntoView();return}render(false)});
render(false);
</script>
</body></html>
