<style>

*,*:before,*:after{box-sizing:inherit}html{scroll-padding-top:70px;scroll-behavior:smooth}

a{color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px}
header.top{position:sticky;top:0;z-index:9;background:var(--red);color:var(--paper)}
header.top .wrap{display:flex;align-items:center;gap:18px;height:56px}
.logo{font-family:Bitter,serif;font-weight:800;text-decoration:none;margin-right:auto;line-height:1.15;font-size:15px}.logo small{display:block;font:400 12px Onest;color:var(--sand)}
nav{display:flex;gap:18px;font-size:15px}nav a{text-decoration:none}nav a:hover{text-decoration:underline}

.hero{background:var(--red);color:var(--paper);padding:56px 0 70px;position:relative}

.hero .wrap{display:grid;grid-template-columns:auto 1.5fr 1fr;gap:36px;align-items:center}.stats{border-right:3px solid var(--paper);padding-right:24px;text-align:right;display:grid;gap:26px;align-self:stretch;align-content:center}.stats b{display:block;font:800 40px/1 Bitter,serif}.stats span{font-size:14px;color:var(--sand)}.hero .kick{font-size:18px;color:var(--sand)}.hero .by{font-size:20px;margin:6px 0 10px}.hl{display:inline-flex;gap:6px;margin-left:8px}.hl button{background:var(--paper);color:var(--red);border:2px solid var(--ink);font:700 13px Onest;padding:1px 10px;cursor:pointer}.hl button.on{background:var(--ink);color:var(--paper)}.side .btns{margin-top:22px;flex-direction:column;align-items:flex-start}
.hero h1{font-size:clamp(40px,7vw,76px);font-weight:800}
.hero .role{font-size:19px;margin:10px 0 18px;color:var(--sand)}
.hero p{max-width:52ch;margin:0 0 12px}
.photo{aspect-ratio:4/5;background:var(--sand);border:3px solid var(--ink);box-shadow:10px 10px 0 var(--deep);display:grid;place-items:center;color:var(--ink);font-size:14px;text-align:center;padding:10px;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
@media(max-width:860px){.hero .wrap{grid-template-columns:1fr}.photo{max-width:280px}.stats{border-right:0;border-left:3px solid var(--paper);padding:0 0 0 16px;text-align:left;grid-auto-flow:column;gap:22px;order:2}}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.btn{display:inline-block;background:var(--paper);color:var(--red);border:2px solid var(--ink);padding:8px 18px;font-weight:700;text-decoration:none;box-shadow:4px 4px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.btn.red{background:var(--red);color:var(--paper)}
section.s{padding:74px 0 10px}
.s h2{font-size:clamp(30px,5vw,46px);margin-bottom:38px;color:var(--deep);text-align:center}.s h2:after{content:"";display:block;width:70px;height:3px;background:var(--ink);margin:12px auto 0}

.tl{position:relative;display:grid;gap:26px}
.tl:before{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:4px;background:var(--red)}
.ev{position:relative;padding-left:44px}
.ev:before{content:"";position:absolute;left:3px;top:7px;width:20px;height:20px;background:var(--bg);border:4px solid var(--red);border-radius:50%}
.ev h3{font-size:22px}.ev .meta{color:var(--deep);font-weight:500;margin:2px 0 6px}
.ev ul{margin:6px 0 0;padding-left:20px}.ev p{margin:6px 0;max-width:60ch}.ev .btn{display:inline-block;margin-top:14px;padding:5px 14px;font-size:15px}.ev ul{clear:both}

.ev:nth-child(even){margin-left:50%;padding:0 0 0 40px;text-align:left}
.ev:nth-child(even):before{right:auto;left:-12px}
.ev p{margin-left:auto}.ev:nth-child(even) p{margin-left:0}.ev ul{display:table;margin-left:auto}.ev:nth-child(even) ul{margin-left:0}}

.tile{position:absolute;display:block;text-decoration:none;color:var(--paper);filter:drop-shadow(3px 0 0 var(--ink)) drop-shadow(-3px 0 0 var(--ink)) drop-shadow(0 3px 0 var(--ink)) drop-shadow(0 -3px 0 var(--ink));transition:transform .15s}

.tile .sh{height:100%;display:grid;place-content:center;text-align:center;padding:14px 24px;background-size:cover;background-position:center}
.tile b{font:800 clamp(18px,2.6vw,30px)/1.15 Bitter,serif}.tile small{display:block;opacity:.85}
.tile.soon{color:var(--deep)}.tile.soon .sh{background:var(--sand)}
.t1{left:0;top:.4%;width:29%;height:64%}
.t2{left:32.4%;top:.4%;width:32.6%;height:64%}
.t3{left:62.3%;top:0;width:37.7%;height:64%}
.t4{left:0;top:69.3%;width:44.5%;height:30.7%}
.t5{left:32.2%;top:69%;width:34.3%;height:30.5%}
.t6{left:58.2%;top:69%;width:41.8%;height:30.5%}
